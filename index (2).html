    <script>
      const storageKey = "jukenbanso-system-static-v1";
      const themeKey = "jukenbanso-background-theme-v1";
      const themeIds = ["paper", "mint", "sky", "lavender", "warm"];
      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
      const seedInput = {
        today: currentDateISO(),
        planningDays: 7,
        settings: {
          planningBufferRatio: 0.8,
          softEndTime: "21:30",
          hardStopTime: "22:20",
          nearStartLockMinutes: 30
        },
        scheduleTemplates: [],
        exceptions: [],
        materials: [],
        existingTasks: [],
        completedTasks: {},
        studyLogs: []
      };

      let planner = loadPlanner();
      let editingMaterialId = "";
      let editingScheduleId = "";
      let visibleTasksByKey = new Map();
      applyTheme(loadTheme());

      function currentDateISO() {
        return localDateISO(new Date());
      }

      function loadTheme() {
        const saved = localStorage.getItem(themeKey);
        return themeIds.includes(saved) ? saved : "paper";
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem(themeKey, theme);
        document.querySelectorAll("[data-theme-choice]").forEach((button) => {
          const active = button.dataset.themeChoice === theme;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
        window.dispatchEvent(new CustomEvent("jukenbanso:theme-saved"));
      }

      function setTransferStatus(message) {
        document.getElementById("transfer-status").textContent = message;
      }

      function setCurrentCloudCode(code) {
        const formatted = formatCloudCode(code);
        document.getElementById("current-cloud-code").textContent = formatted || "未設定";
      }

      async function copyCurrentCloudCode() {
        const value = document.getElementById("current-cloud-code").textContent;
        if (!value || value === "未設定") {
          setTransferStatus("まだ個人コードがありません。先に生成するか、既存コードを開いてください。");
          return;
        }

        try {
          await navigator.clipboard.writeText(value);
          setTransferStatus(`個人コード ${value} をコピーしました。`);
        } catch {
          setTransferStatus("コピーできませんでした。表示されている個人コードを手動で選択してください。");
        }
      }

      function encodeTransferCode() {
        const payload = {
          version: 1,
          app: "jukenbanso",
          exportedAt: new Date().toISOString(),
          theme: loadTheme(),
          planner
        };
        const json = JSON.stringify(payload);
        const bytes = new TextEncoder().encode(json);
        let binary = "";
        for (let index = 0; index < bytes.length; index += 0x8000) {
          binary += String.fromCharCode(...bytes.slice(index, index + 0x8000));
        }
        return `JB1-${btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/u, "")}`;
      }

      function decodeTransferCode(rawCode) {
        const compact = rawCode.trim().replace(/^JB1-/iu, "").replace(/\s+/gu, "");
        if (!compact) throw new Error("コードが空です。");

        const base64 = compact.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, "=");
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        const payload = JSON.parse(new TextDecoder().decode(bytes));

        if (payload?.app !== "jukenbanso" || payload?.version !== 1 || !payload?.planner) {
          throw new Error("受験伴走システムの引き継ぎコードとして読み込めません。");
        }
        if (!Array.isArray(payload.planner.materials) || !Array.isArray(payload.planner.scheduleTemplates)) {
          throw new Error("コードの中身が壊れているようです。");
        }

        return payload;
      }

      function loadPlanner() {
        const saved = localStorage.getItem(storageKey);
        const loaded = saved ? JSON.parse(saved) : structuredClone(seedInput);
        return {
          ...seedInput,
          ...loaded,
          today: currentDateISO(),
          settings: {
            ...seedInput.settings,
            ...(loaded.settings || {})
          },
          scheduleTemplates: Array.isArray(loaded.scheduleTemplates) ? loaded.scheduleTemplates : [],
          exceptions: Array.isArray(loaded.exceptions) ? loaded.exceptions : [],
          materials: Array.isArray(loaded.materials)
            ? loaded.materials.map((material) => ({ ...material, weekdays: normalizeMaterialWeekdays(material) }))
            : [],
          existingTasks: Array.isArray(loaded.existingTasks) ? loaded.existingTasks : [],
          completedTasks: loaded.completedTasks && typeof loaded.completedTasks === "object" ? loaded.completedTasks : {},
          studyLogs: Array.isArray(loaded.studyLogs) ? loaded.studyLogs : []
        };
      }

      function savePlanner() {
        planner.today = currentDateISO();
        localStorage.setItem(storageKey, JSON.stringify(planner));
        window.dispatchEvent(new CustomEvent("jukenbanso:planner-saved"));
      }

      function planStudy(input) {
        input.today = currentDateISO();
        const dates = Array.from({ length: input.planningDays || 7 }, (_, index) => addDays(input.today, index));
        const baseMaterials = input.materials.filter((item) => item.active !== false);
        const paceReports = buildPaceReports(input, baseMaterials);
        const paceByMaterial = new Map(paceReports.map((report) => [report.materialId, report]));
        const activeMaterials = baseMaterials.map((material) => ({
          ...material,
          weekdays: normalizeMaterialWeekdays(material),
          pacePressure: paceByMaterial.get(material.id)?.pressure || 0
        }));
        const immutableTasks = input.existingTasks.filter((task) => task.locked || task.status === "closed" || task.status === "in_progress");
        const usedRanges = new Map();
        for (const task of immutableTasks) addRange(usedRanges, task.materialId, task.rangeStart, task.rangeEnd);
        const cursors = new Map(activeMaterials.map((material) => [material.id, material.currentValue]));
        const generated = [];
        const blocksByDate = new Map();
        const warnings = [];

        for (const date of dates) {
          blocksByDate.set(date, availableBlocks(input, date));
        }

        if (activeMaterials.length === 0) {
          warnings.push({ code: "no_materials", materialId: "", message: "教材を追加すると、この欄に学習予定が作られます。" });
        }

        const hasStudyBlocks = dates.some((date) => (blocksByDate.get(date) || []).length > 0);
        if (!hasStudyBlocks) {
          warnings.push({ code: "no_schedule", materialId: "", message: "生活時間に学習枠を追加すると、教材を割り当てられます。" });
        }

        for (const report of paceReports) {
          if (report.status === "no_time") {
            warnings.push({ code: "no_compatible_time", materialId: report.materialId, message: `${report.name} に使える学習枠が期限までにありません。教材の場所と生活時間の場所を確認してください。` });
          }
          if (report.status === "shortage") {
            warnings.push({ code: "infeasible_deadline", materialId: report.materialId, message: `${report.name} は期限までに約${report.shortageMinutes}分不足します。必要ペースを確認してください。` });
          }
        }

        for (const date of dates) {
          for (const block of blocksByDate.get(date) || []) {
            while (block.usedMinutes < block.minutes) {
              const remainingMinutes = block.minutes - block.usedMinutes;
              const material = chooseMaterial(activeMaterials, cursors, usedRanges, date, block, remainingMinutes);
              if (!material) break;
              const qty = schedulableQty(material, remainingMinutes, cursors);
              const minutes = qty * minutesPerUnit(material);
              const range = nextRange(material, qty, cursors, usedRanges);
              if (!range || minutes <= 0 || block.usedMinutes + minutes > block.minutes + 0.001) break;

              addTask(generated, date, block, material, range, qty, minutes);
              block.usedMinutes += minutes;
              cursors.set(material.id, range.end);
              addRange(usedRanges, material.id, range.start, range.end);
            }
          }
        }

        if (activeMaterials.length > 0 && hasStudyBlocks && generated.length === 0) {
          warnings.push({ code: "no_generated_tasks", materialId: "", message: "教材の場所と生活時間の場所が合っているか、期限・分/単位・最小分割量を確認してください。" });
        }

        const tasks = [...immutableTasks, ...generated].sort((a, b) =>
          `${a.date}:${a.startAt || ""}:${a.materialId}`.localeCompare(`${b.date}:${b.startAt || ""}:${b.materialId}`),
        );
        return {
          tasks,
          changedTaskCount: generated.length,
          warnings,
          paceReports,
          schedulerRevision: revision(tasks, warnings),
          summary: {
            plannedMinutes: Math.round(generated.reduce((sum, task) => sum + task.estimatedMinutes, 0))
          }
        };
      }

      function buildPaceReports(input, materials) {
        return materials.map((material) => {
          const materialWeekdays = normalizeMaterialWeekdays(material);
          const remainingUnits = Math.max(0, material.endValue - material.currentValue);
          const unitMinutes = minutesPerUnit(material);
          const requiredMinutes = Math.round(remainingUnits * unitMinutes);
          const deadline = material.deadline || input.today;
          const daysLeft = Math.max(1, daysBetween(input.today, deadline) + 1);
          const dates = Array.from({ length: Math.min(daysLeft, 180) }, (_, index) => addDays(input.today, index));
          const compatibleBlocks = dates
            .filter((date) => materialWeekdays.includes(new Date(`${date}T00:00:00`).getDay()))
            .flatMap((date) => availableBlocks(input, date))
            .filter((block) => contextFits(material.context, block.context));
          const availableMinutes = Math.round(compatibleBlocks.reduce((sum, block) => sum + block.minutes, 0));
          const studyDays = new Set(compatibleBlocks.map((block) => block.date)).size;
          const sessionCount = compatibleBlocks.length;
          const possibleUnits = unitMinutes > 0 ? availableMinutes / unitMinutes : 0;
          const shortageMinutes = Math.max(0, requiredMinutes - availableMinutes);
          const pressure = requiredMinutes === 0 ? 0 : requiredMinutes / Math.max(1, availableMinutes);
          let status = "ok";
          if (remainingUnits <= 0) status = "done";
          else if (availableMinutes <= 0) status = "no_time";
          else if (shortageMinutes > 0) status = "shortage";
          else if (pressure >= 0.85) status = "tight";

          return {
            materialId: material.id,
            subject: material.subject,
            name: material.name,
            unitType: material.unitType,
            remainingUnits: roundQty(remainingUnits),
            requiredMinutes,
            availableMinutes,
            shortageMinutes,
            possibleUnits: roundQty(possibleUnits),
            daysLeft,
            studyDays,
            sessionCount,
            unitsPerDay: roundQty(remainingUnits / daysLeft),
            unitsPerStudyDay: roundQty(remainingUnits / Math.max(1, studyDays)),
            unitsPerSession: roundQty(remainingUnits / Math.max(1, sessionCount)),
            weekdays: materialWeekdays,
            pressure,
            status
          };
        });
      }

      function availableBlocks(input, date) {
        const weekday = new Date(`${date}T00:00:00`).getDay();
        const hardStop = hardStopFor(input, date);
        let blocks = input.scheduleTemplates
          .filter((template) => template.active !== false && template.weekday === weekday)
          .map((template) => {
            const startAt = timestamp(date, template.startTime);
            const templateEndAt = timestamp(date, template.endTime);
            const hardStopAt = timestamp(date, hardStop);
            const endAt = hardStopAt > startAt ? Math.min(templateEndAt, hardStopAt) : templateEndAt;
            return {
              id: `${date}:${template.id}`,
              date,
              label: template.label,
              context: template.context,
              focusLevel: template.focusLevel,
              startAt,
              endAt,
              minutes: Math.max(0, (endAt - startAt) / 60000),
              usedMinutes: 0
            };
          })
          .filter((block) => block.minutes > 0);

        for (const exception of input.exceptions.filter((item) => item.date === date)) {
          if (exception.type === "capacity_delta" && exception.deltaMinutes < 0) {
            let remaining = Math.abs(exception.deltaMinutes);
            blocks = blocks
              .sort((a, b) => b.endAt - a.endAt)
              .map((block) => {
                if (remaining <= 0) return block;
                const cut = Math.min(block.minutes, remaining);
                remaining -= cut;
                block.endAt -= cut * 60000;
                block.minutes = Math.max(0, (block.endAt - block.startAt) / 60000);
                return block;
              })
              .filter((block) => block.minutes > 0)
              .sort((a, b) => a.startAt - b.startAt);
          }
        }
        return blocks;
      }

      function chooseMaterial(materials, cursors, usedRanges, date, block, remainingMinutes) {
        return materials
          .map((material) => ({ ...material, cursor: cursors.get(material.id) ?? material.currentValue }))
          .filter((material) => material.active !== false)
          .filter((material) => material.cursor < material.endValue)
          .filter((material) => materialAllowedOnDate(material, date))
          .filter((material) => contextFits(material.context, block.context))
          .filter((material) => schedulableQty(material, remainingMinutes, cursors) > 0)
          .filter((material) => nextRange(material, schedulableQty(material, remainingMinutes, cursors), cursors, usedRanges))
          .sort((a, b) => score(b, date, block) - score(a, date, block))[0] || null;
      }

      function addTask(generated, date, block, material, range, qty, minutes) {
        const startAt = block.startAt + block.usedMinutes * 60000;
        const endAt = startAt + minutes * 60000;
        generated.push({
          id: `planned:${date}:${block.id}:${material.id}:${generated.length}`,
          date,
          slotId: block.id,
          blockLabel: block.label,
          materialId: material.id,
          materialName: material.name,
          subject: material.subject,
          rangeStart: range.start,
          rangeEnd: range.end,
          unitType: material.unitType,
          minimumQty: qty,
          standardQty: qty,
          extraQty: qty,
          estimatedMinutes: minutes,
          startAt: new Date(startAt).toISOString(),
          endAt: new Date(endAt).toISOString(),
          status: "planned",
          locked: false
        });
      }

      function nextRange(material, qty, cursors, usedRanges) {
        let start = cursors.get(material.id) || material.currentValue;
        const ranges = usedRanges.get(material.id) || [];
        while (start < material.endValue) {
          const end = Math.min(material.endValue, start + qty);
          const conflict = ranges.find((range) => start < range.end && end > range.start);
          if (!conflict) return { start, end };
          start = conflict.end;
        }
        return null;
      }

      function schedulableQty(material, remainingMinutes, cursors) {
        const unitMinutes = minutesPerUnit(material);
        if (unitMinutes <= 0 || remainingMinutes <= 0) return 0;
        const cursor = cursors.get(material.id) ?? material.currentValue;
        const remainingUnits = Math.max(0, material.endValue - cursor);
        if (remainingUnits <= 0) return 0;

        const preferred = Math.min(Math.max(material.minChunk || 1, 0.1), remainingUnits);
        if (preferred * unitMinutes <= remainingMinutes + 0.001) return roundQty(preferred);

        const step = preferred >= 1 ? 1 : Math.max(0.1, preferred);
        const fit = Math.floor(Math.min(remainingUnits, remainingMinutes / unitMinutes) / step) * step;
        return roundQty(Math.max(0, fit));
      }

      function roundQty(value) {
        return Number(value.toFixed(2));
      }

      function score(material, date, block) {
        const daysLeft = Math.max(0, daysBetween(date, material.deadline));
        const deadline = Math.max(0, 42 - daysLeft * 6);
        const fit = material.context === block.context ? 14 : 5;
        const pace = Math.min(80, Math.round((material.pacePressure || 0) * 24));
        return material.subjectPriority * 12 + material.materialPriority * 8 + deadline + fit + pace;
      }

      function normalizeMaterialWeekdays(material) {
        if (!Array.isArray(material.weekdays) || material.weekdays.length === 0) return [0, 1, 2, 3, 4, 5, 6];
        const unique = [...new Set(material.weekdays.map(Number).filter((day) => day >= 0 && day <= 6))];
        return unique.length > 0 ? unique.sort((a, b) => a - b) : [0, 1, 2, 3, 4, 5, 6];
      }

      function materialAllowedOnDate(material, date) {
        return normalizeMaterialWeekdays(material).includes(new Date(`${date}T00:00:00`).getDay());
      }

      function weekdayText(days) {
        const normalized = Array.isArray(days) ? days : [0, 1, 2, 3, 4, 5, 6];
        if (normalized.length === 7) return "全曜日";
        return normalized.map((day) => weekdays[day]).join("・");
      }

      function render() {
        const result = planStudy(planner);
        const allPlannedTasks = result.tasks.filter((task) => task.status === "planned");
        const plannedTasks = allPlannedTasks.filter((task) => !taskIsCompleted(task));
        visibleTasksByKey = new Map(plannedTasks.map((task) => [taskCompletionKey(task), task]));
        const completedRecords = completionRecords();
        const subjectStats = {};
        for (const task of plannedTasks) {
          if (!subjectStats[task.subject]) subjectStats[task.subject] = { minutes: 0, total: 0, done: 0 };
          subjectStats[task.subject].minutes += task.estimatedMinutes;
          subjectStats[task.subject].total += 1;
        }
        for (const record of completedRecords) {
          if (!subjectStats[record.subject]) subjectStats[record.subject] = { minutes: 0, total: 0, done: 0 };
          subjectStats[record.subject].done += 1;
        }

        document.getElementById("soft-end").value = planner.settings.softEndTime;
        document.getElementById("hard-stop").value = planner.settings.hardStopTime;
        const studyLogDate = document.querySelector('#study-log-form [name="date"]');
        const studyTaskDate = document.getElementById("study-task-date");
        const studyMaterialDate = document.getElementById("study-material-date");
        if (studyLogDate && !studyLogDate.value) studyLogDate.value = planner.today;
        if (studyTaskDate && !studyTaskDate.value) studyTaskDate.value = planner.today;
        if (studyMaterialDate && !studyMaterialDate.value) studyMaterialDate.value = planner.today;
        renderStudyTaskChoices(plannedTasks);
        renderStudyMaterialChoices();
        document.getElementById("today-panel").innerHTML = `
          <section class="summary-grid" aria-label="Scheduler result">
            ${metric("変更件数", `${result.changedTaskCount}件`, "blue")}
            ${metric("予定時間", `${result.summary.plannedMinutes}分`, "green")}
            ${metric("警告", `${result.warnings.length}件`, "amber")}
            ${metric("完了履歴", `${completedRecords.length}件`, "slate")}
          </section>
          <section class="today-band">
            <div><p class="eyebrow">Today</p><h2>今日以降の自動配分</h2></div>
            <span>rev ${result.schedulerRevision}</span>
          </section>
          <section class="task-list" aria-label="Planned tasks">
            ${plannedTasks.length === 0 ? `<div class="empty-state">教材と生活時間を追加すると、ここに日付・時間つきの予定が表示されます。</div>` : plannedTasks.slice(0, 18).map(taskCard).join("")}
          </section>
          <section class="today-band">
            <div><p class="eyebrow">Pace</p><h2>教材別の必要ペース</h2></div>
            <span>${result.paceReports.length}件</span>
          </section>
          <section class="pace-list" aria-label="Material pace">
            ${result.paceReports.length === 0 ? `<div class="empty-state">教材を追加すると、残り量と使える時間から必要ペースを計算します。</div>` : result.paceReports.map(paceCard).join("")}
          </section>
          <section class="two-column">
            <div class="panel"><h2>教科別予定・完了</h2><div class="bars">
              ${Object.entries(subjectStats).map(([subject, stats]) => `
                <div class="bar-row"><span>${escapeHtml(subject)}</span><div><i style="width:${Math.min(100, stats.minutes)}%"></i></div><b>${stats.done}/${stats.total}件</b></div>
              `).join("")}
            </div></div>
            <div class="panel"><h2>検出された警告</h2>
              ${result.warnings.length === 0 ? `<p class="quiet">実現困難な教材はありません。</p>` : `<ul class="warning-list">${result.warnings.map((warning) => `<li>${escapeHtml(warning.message)}</li>`).join("")}</ul>`}
            </div>
          </section>
        `;

        document.getElementById("material-list").innerHTML = planner.materials.length === 0
          ? `<p class="quiet">登録済み教材はありません。</p>`
          : planner.materials.map((material) => `
          <div>
            <b>${escapeHtml(material.subject)}</b>
            <span>${escapeHtml(material.name)}</span>
            <small>${material.currentValue}〜${material.endValue}${escapeHtml(material.unitType)} / ${escapeHtml(weekdayText(normalizeMaterialWeekdays(material)))}</small>
            <span class="item-actions">
              <button type="button" data-material-action="edit" data-material-id="${escapeHtml(material.id)}">編集</button>
              <button type="button" data-material-action="delete" data-material-id="${escapeHtml(material.id)}">削除</button>
            </span>
          </div>
        `).join("");

        document.getElementById("schedule-list").innerHTML = renderScheduleGroups();
        document.getElementById("material-workspace").innerHTML = renderMaterialWorkspace(result, plannedTasks, completedRecords);
        document.getElementById("study-log-summary").innerHTML = renderStudyLogSummary();
        document.getElementById("study-log-list").innerHTML = renderStudyLogs();
      }

      function renderScheduleGroups() {
        if (planner.scheduleTemplates.length === 0) return `<p class="quiet">登録済み学習枠はありません。</p>`;

        return weekdays.map((day, weekday) => {
          const blocks = planner.scheduleTemplates
            .filter((block) => block.weekday === weekday)
            .sort((a, b) => a.startTime.localeCompare(b.startTime));

          return `
            <section class="weekday-group">
              <strong class="weekday-group-title">${day}曜</strong>
              ${blocks.length === 0 ? `<p class="quiet">学習枠なし</p>` : blocks.map((block) => `
          <div>
            <b>${escapeHtml(block.context === "mobile" ? "通学" : block.context === "desk" ? "机" : "共通")}</b>
            <span>${escapeHtml(block.label)}</span>
            <small>${block.startTime}〜${block.endTime}</small>
            <span class="item-actions">
              <button type="button" data-schedule-action="edit" data-schedule-id="${escapeHtml(block.id)}">編集</button>
              <button type="button" data-schedule-action="delete" data-schedule-id="${escapeHtml(block.id)}">削除</button>
            </span>
          </div>
              `).join("")}
            </section>
          `;
        }).join("");
      }

      function renderMaterialWorkspace(result, plannedTasks, completedRecords) {
        if (planner.materials.length === 0) return `<div class="empty-state">教材を追加すると、ここで教材ごとの予定と完了履歴を確認できます。</div>`;
        const paceByMaterial = new Map(result.paceReports.map((report) => [report.materialId, report]));

        return planner.materials.map((material) => {
          const upcoming = plannedTasks.filter((task) => task.materialId === material.id).slice(0, 6);
          const done = completedRecords.filter((record) => record.materialId === material.id).slice(0, 6);
          const pace = paceByMaterial.get(material.id);
          const progress = `${material.currentValue} / ${material.endValue}${material.unitType}`;
          const paceText = pace ? `残り ${pace.remainingUnits}${pace.unitType}・学習日あたり ${pace.unitsPerStudyDay}${pace.unitType}` : "予定計算待ち";

          return `
            <article class="material-card">
              <header>
                <div>
                  <span class="subject">${escapeHtml(material.subject)}</span>
                  <strong>${escapeHtml(material.name)}</strong>
                </div>
                <small>${escapeHtml(progress)} / ${escapeHtml(weekdayText(normalizeMaterialWeekdays(material)))}</small>
              </header>
              <div class="mini-section">
                <h3>これからの予定</h3>
                ${upcoming.length === 0 ? `<p class="quiet">この教材の未完了予定はありません。${escapeHtml(paceText)}</p>` : `<div class="mini-list">${upcoming.map(miniTaskRow).join("")}</div>`}
              </div>
              <div class="mini-section">
                <h3>完了したタスク</h3>
                ${done.length === 0 ? `<p class="quiet">まだ完了履歴はありません。</p>` : `<div class="mini-list">${done.map(completedTaskRow).join("")}</div>`}
              </div>
            </article>
          `;
        }).join("");
      }

      function renderStudyLogSummary() {
        const logs = studyTimeRecords();
        const today = currentDateISO();
        const weekStart = addDays(today, -6);
        const todayMinutes = logs
          .filter((log) => log.date === today)
          .reduce((sum, log) => sum + Number(log.minutes || 0), 0);
        const weekMinutes = logs
          .filter((log) => log.date >= weekStart && log.date <= today)
          .reduce((sum, log) => sum + Number(log.minutes || 0), 0);
        const totalMinutes = logs.reduce((sum, log) => sum + Number(log.minutes || 0), 0);
        const automaticMinutes = logs
          .filter((log) => log.source === "task")
          .reduce((sum, log) => sum + Number(log.minutes || 0), 0);
        return `
          <span>今日<br>${escapeHtml(minutesText(todayMinutes))}</span>
          <span>直近7日<br>${escapeHtml(minutesText(weekMinutes))}</span>
          <span>累積<br>${escapeHtml(minutesText(totalMinutes))}</span>
          <span>自動入力<br>${escapeHtml(minutesText(automaticMinutes))}</span>
        `;
      }

      function renderStudyLogs() {
        const logs = studyTimeRecords().sort((a, b) => `${b.date}:${b.createdAt || ""}`.localeCompare(`${a.date}:${a.createdAt || ""}`));
        if (logs.length === 0) return `<p class="quiet">まだ学習時間の記録はありません。</p>`;

        return logs.slice(0, 20).map((log) => `
          <div>
            <b>${escapeHtml(formatDateLabel(log.date))}</b>
            <span>${escapeHtml(minutesText(log.minutes || 0))} ${escapeHtml(log.label || "")}</span>
            <small>
              ${log.source === "manual" ? `<button type="button" data-study-log-delete="${escapeHtml(log.id)}">削除</button>` : "自動入力"}
            </small>
          </div>
        `).join("");
      }

      function renderStudyTaskChoices(plannedTasks) {
        const select = document.getElementById("study-task-select");
        const progress = document.getElementById("study-task-progress");
        const minutes = document.getElementById("study-task-minutes");
        const submit = document.querySelector("#study-task-form button[type='submit']");
        if (!select || !progress || !minutes || !submit) return;

        const tasks = plannedTasks.slice(0, 50);
        const previous = select.value;
        if (tasks.length === 0) {
          select.innerHTML = `<option value="">登録済み課題がありません</option>`;
          select.disabled = true;
          progress.value = "";
          minutes.value = "";
          progress.disabled = true;
          minutes.disabled = true;
          submit.disabled = true;
          return;
        }

        select.disabled = false;
        progress.disabled = false;
        minutes.disabled = false;
        submit.disabled = false;
        select.innerHTML = tasks.map((task) => {
          const key = taskCompletionKey(task);
          return `<option value="${escapeHtml(key)}">${escapeHtml(studyTaskLabel(task))}</option>`;
        }).join("");
        if (previous && visibleTasksByKey.has(previous)) select.value = previous;
        syncStudyTaskFields();
      }

      function syncStudyTaskFields() {
        const select = document.getElementById("study-task-select");
        const progress = document.getElementById("study-task-progress");
        const minutes = document.getElementById("study-task-minutes");
        if (!select || !progress || !minutes) return;
        const task = visibleTasksByKey.get(select.value);
        if (!task) return;
        progress.min = task.rangeStart;
        progress.max = task.rangeEnd;
        progress.value = task.rangeEnd;
        minutes.value = Math.max(1, Math.round(task.estimatedMinutes));
      }

      function studyTaskLabel(task) {
        return `${formatDateLabel(task.date)} ${task.materialName} ${task.rangeStart}〜${task.rangeEnd}${task.unitType}`;
      }

      function renderStudyMaterialChoices() {
        const select = document.getElementById("study-material-select");
        const quantity = document.getElementById("study-material-quantity");
        const minutes = document.getElementById("study-material-minutes");
        const submit = document.querySelector("#study-material-form button[type='submit']");
        if (!select || !quantity || !minutes || !submit) return;

        const materials = planner.materials.filter((material) => material.active !== false && Number(material.currentValue) < Number(material.endValue));
        const previous = select.value;
        if (materials.length === 0) {
          select.innerHTML = `<option value="">記録できる教材がありません</option>`;
          select.disabled = true;
          quantity.value = "";
          minutes.value = "";
          quantity.disabled = true;
          minutes.disabled = true;
          submit.disabled = true;
          return;
        }

        select.disabled = false;
        quantity.disabled = false;
        minutes.disabled = false;
        submit.disabled = false;
        select.innerHTML = materials.map((material) => `
          <option value="${escapeHtml(material.id)}">${escapeHtml(material.name)} / 現在 ${material.currentValue}${escapeHtml(material.unitType)}</option>
        `).join("");
        if (previous && materials.some((material) => material.id === previous)) select.value = previous;
        syncStudyMaterialFields();
      }

      function syncStudyMaterialFields() {
        const select = document.getElementById("study-material-select");
        const quantity = document.getElementById("study-material-quantity");
        const minutes = document.getElementById("study-material-minutes");
        if (!select || !quantity || !minutes) return;
        const material = planner.materials.find((item) => item.id === select.value);
        if (!material) return;
        const remaining = Math.max(0, Number(material.endValue) - Number(material.currentValue));
        const chunk = Math.min(remaining, Math.max(Number(material.minChunk || 1), 0.1));
        quantity.max = remaining;
        quantity.value = roundQty(chunk);
        minutes.value = Math.max(1, Math.round(chunk * minutesPerUnit(material)));
      }

      function studyTimeRecords() {
        const manualLogs = (planner.studyLogs || []).map((log) => ({ ...log, source: "manual" }));
        const taskLogs = completionRecords().map((record) => ({
          id: `task-time:${record.key}`,
          date: record.date,
          minutes: record.actualMinutes || record.estimatedMinutes || 0,
          label: record.recordType === "material_log"
            ? "教材記録から自動入力"
            : record.partial ? "途中保存から自動入力" : "完了から自動入力",
          createdAt: record.completedAt,
          source: "task"
        }));
        return [...manualLogs, ...taskLogs];
      }

      function miniTaskRow(task) {
        return `
          <div class="mini-row">
            <b>${escapeHtml(formatDateLabel(task.date))}</b>
            <span>${escapeHtml(task.materialName)} ${task.rangeStart}〜${task.rangeEnd}${escapeHtml(task.unitType)} / ${escapeHtml(formatTimeRange(task))}</span>
          </div>
        `;
      }

      function completedTaskRow(record) {
        const scheduled = record.scheduledDate && record.scheduledDate !== record.date
          ? ` / 予定 ${formatDateLabel(record.scheduledDate)}`
          : "";
        const note = record.recordType === "material_log"
          ? `教材記録 ${record.rangeStart}〜${record.rangeEnd}`
          : record.partial ? `途中 ${record.rangeStart}〜${record.rangeEnd} / 予定 ${record.plannedRangeEnd}` : `${record.rangeStart}〜${record.rangeEnd}`;
        const actual = record.actualMinutes ? ` / 実績 ${Math.round(record.actualMinutes)}分` : "";
        return `
          <div class="mini-row">
            <b>${escapeHtml(formatDateLabel(record.date))}</b>
            <span>${escapeHtml(note)}${escapeHtml(record.unitType)}${escapeHtml(actual)}${escapeHtml(scheduled)} / ${escapeHtml(record.completedAtLabel || "")}</span>
          </div>
        `;
      }

      function completionRecords(materialId = "") {
        return Object.values(planner.completedTasks || {})
          .filter((record) => record && typeof record === "object" && record.completedAt)
          .filter((record) => !materialId || record.materialId === materialId)
          .map((record) => ({
            ...record,
            completedAtLabel: record.completedAt ? timeLabel(record.completedAt) : ""
          }))
          .sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)));
      }

      function taskIsCompleted(task) {
        return Boolean(planner.completedTasks?.[taskCompletionKey(task)]);
      }

      function metric(label, value, tone) {
        return `<div class="metric metric-${tone}"><span>${label}</span><strong>${value}</strong></div>`;
      }

      function taskCard(task) {
        const key = taskCompletionKey(task);
        return `
          <article class="task-card" data-task-key="${escapeHtml(key)}">
            <div class="task-main">
              <span class="subject">${escapeHtml(task.subject)}</span>
              <h3>${escapeHtml(task.materialName)}</h3>
              <div class="task-meta">
                <span>${formatDateLabel(task.date)}</span>
                <span>${formatTimeRange(task)}</span>
                <span>${escapeHtml(task.blockLabel || "学習枠")}</span>
              </div>
              <p>${task.rangeStart}〜${task.rangeEnd}${escapeHtml(task.unitType)} / ${Math.round(task.estimatedMinutes)}分</p>
            </div>
            <div class="thresholds" aria-label="Thresholds">
              <label class="task-complete">
                <input type="checkbox" data-complete-task="${escapeHtml(key)}" />
                完了して消す
              </label>
              <label class="task-progress">
                ここまで
                <input type="number" min="${task.rangeStart}" max="${task.rangeEnd}" step="0.1" value="${task.rangeEnd}" data-partial-value />
              </label>
              <label class="task-progress">
                かかった時間
                <input type="number" min="1" step="1" value="${Math.max(1, Math.round(task.estimatedMinutes))}" data-actual-minutes />
              </label>
              <button class="progress-action" type="button" data-partial-task="${escapeHtml(key)}">途中保存</button>
              <span>予定 ${task.standardQty}</span>
              <span>${Math.round(task.estimatedMinutes)}分</span>
            </div>
          </article>
        `;
      }

      function paceCard(report) {
        const tone = report.status === "shortage" || report.status === "no_time"
          ? "pace-danger"
          : report.status === "tight"
            ? "pace-warning"
            : "pace-ok";
        const statusText = {
          done: "完了済み",
          ok: "このペースで可",
          tight: "余裕少なめ",
          shortage: "時間不足",
          no_time: "対応する学習枠なし"
        }[report.status] || "確認中";

        return `
          <article class="pace-card ${tone}">
            <div>
              <span class="subject">${escapeHtml(report.subject)}</span>
              <strong>${escapeHtml(report.name)}</strong>
              <small>残り ${report.remainingUnits}${escapeHtml(report.unitType)} / 必要 ${report.requiredMinutes}分 / 使える ${report.availableMinutes}分</small>
              <small>実施曜日 ${escapeHtml(weekdayText(report.weekdays))}</small>
            </div>
            <div class="pace-grid">
              <span>状態<br>${statusText}</span>
              <span>1日あたり<br>${report.unitsPerDay}${escapeHtml(report.unitType)}</span>
              <span>学習日あたり<br>${report.unitsPerStudyDay}${escapeHtml(report.unitType)}</span>
              <span>1枠あたり<br>${report.unitsPerSession}${escapeHtml(report.unitType)}</span>
            </div>
          </article>
        `;
      }

      function taskCompletionKey(task) {
        return [
          task.date,
          task.slotId,
          task.materialId,
          task.rangeStart,
          task.rangeEnd
        ].join("|");
      }

      function completeTask(task, completedUntil, actualMinutes, completedDate = currentDateISO()) {
        const material = planner.materials.find((item) => item.id === task.materialId);
        if (!material) return false;

        const target = Number(completedUntil);
        if (!Number.isFinite(target)) return false;
        const doneUntil = roundQty(Math.min(task.rangeEnd, Math.max(task.rangeStart, target)));
        if (doneUntil <= task.rangeStart) {
          alert("進んだ位置を入力してください。");
          return false;
        }

        const key = taskCompletionKey(task);
        const ratio = (doneUntil - task.rangeStart) / Math.max(0.001, task.rangeEnd - task.rangeStart);
        const minutes = Math.max(1, Math.round(Number(actualMinutes || task.estimatedMinutes * ratio)));
        planner.completedTasks = planner.completedTasks || {};
        planner.completedTasks[key] = {
          key,
          date: completedDate || currentDateISO(),
          scheduledDate: task.date,
          slotId: task.slotId,
          blockLabel: task.blockLabel,
          materialId: task.materialId,
          materialName: task.materialName,
          subject: task.subject,
          unitType: task.unitType,
          rangeStart: task.rangeStart,
          rangeEnd: doneUntil,
          plannedRangeEnd: task.rangeEnd,
          estimatedMinutes: Math.round(task.estimatedMinutes * ratio),
          actualMinutes: minutes,
          partial: doneUntil < task.rangeEnd,
          completedAt: new Date().toISOString()
        };

        material.currentValue = roundQty(Math.max(Number(material.currentValue) || 0, doneUntil));
        if (material.currentValue >= material.endValue) material.currentValue = material.endValue;
        planner.existingTasks = planner.existingTasks.filter((item) => taskCompletionKey(item) !== key);
        savePlanner();
        render();
        return true;
      }

      function recordMaterialStudy(materialId, date, quantity, actualMinutes) {
        const material = planner.materials.find((item) => item.id === materialId);
        if (!material) {
          alert("記録する教材を選んでください。");
          return false;
        }

        const amount = Number(quantity);
        if (!Number.isFinite(amount) || amount <= 0) {
          alert("学習量を入力してください。");
          return false;
        }

        const start = Number(material.currentValue) || 0;
        const end = roundQty(Math.min(Number(material.endValue), start + amount));
        if (end <= start) {
          alert("この教材は終了位置まで進んでいます。");
          return false;
        }

        const minutes = Math.max(1, Math.round(Number(actualMinutes || (end - start) * minutesPerUnit(material))));
        const key = createId("material-study");
        planner.completedTasks = planner.completedTasks || {};
        planner.completedTasks[key] = {
          key,
          recordType: "material_log",
          date: date || currentDateISO(),
          slotId: "material-log",
          blockLabel: "教材から記録",
          materialId: material.id,
          materialName: material.name,
          subject: material.subject,
          unitType: material.unitType,
          rangeStart: start,
          rangeEnd: end,
          plannedRangeEnd: end,
          estimatedMinutes: Math.round((end - start) * minutesPerUnit(material)),
          actualMinutes: minutes,
          partial: false,
          completedAt: new Date().toISOString()
        };

        material.currentValue = end;
        if (material.currentValue >= material.endValue) material.currentValue = material.endValue;
        savePlanner();
        render();
        return true;
      }

      function actualMinutesFromCard(card, task) {
        const value = Number(card?.querySelector("[data-actual-minutes]")?.value);
        return Number.isFinite(value) && value > 0 ? value : Math.max(1, Math.round(task.estimatedMinutes));
      }

      function formatDateLabel(date) {
        const day = weekdays[new Date(`${date}T00:00:00`).getDay()];
        return `${date.slice(5).replace("-", "/")}(${day})`;
      }

      function formatTimeRange(task) {
        if (!task.startAt || !task.endAt) return "時間未設定";
        return `${timeLabel(task.startAt)}〜${timeLabel(task.endAt)}`;
      }

      function timeLabel(value) {
        const date = new Date(value);
        return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      }

      function minutesText(value) {
        const minutes = Math.max(0, Math.round(Number(value || 0)));
        const hours = Math.floor(minutes / 60);
        const rest = minutes % 60;
        if (hours <= 0) return `${rest}分`;
        if (rest === 0) return `${hours}時間`;
        return `${hours}時間${rest}分`;
      }

      function addRange(map, materialId, start, end) {
        const list = map.get(materialId) || [];
        list.push({ start, end });
        list.sort((a, b) => a.start - b.start);
        map.set(materialId, list);
      }

      function hardStopFor(input, date) {
        const override = input.exceptions.find((item) => item.date === date && item.type === "hard_stop_override");
        return override ? override.endAt : input.settings.hardStopTime;
      }

      function contextFits(materialContext, blockContext) {
        return materialContext === "either" || blockContext === "either" || materialContext === blockContext;
      }

      function minutesPerUnit(material) {
        return material.estimatedMinutesPerUnit || material.initialMinutesPerUnit || 10;
      }

      function timestamp(date, time) {
        return new Date(`${date}T${time}:00`).getTime();
      }

      function localDateISO(date) {
        const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return local.toISOString().slice(0, 10);
      }

      function addDays(date, amount) {
        const next = new Date(`${date}T00:00:00`);
        next.setDate(next.getDate() + amount);
        return localDateISO(next);
      }

      function daysBetween(startDate, endDate) {
        return Math.round((new Date(`${endDate}T00:00:00`).getTime() - new Date(`${startDate}T00:00:00`).getTime()) / 86400000);
      }

      function revision(tasks, warnings) {
        const text = JSON.stringify({ tasks, warnings });
        let hash = 0;
        for (let index = 0; index < text.length; index += 1) hash = (hash * 31 + text.charCodeAt(index)) >>> 0;
        return hash;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[char]);
      }

      function formValue(data, key) {
        return String(data.get(key) || "");
      }

      function formNumber(data, key) {
        return Number(data.get(key) || 0);
      }

      function createId(prefix) {
        if (crypto && crypto.randomUUID) return `${prefix}:${crypto.randomUUID()}`;
        return `${prefix}:${Date.now()}:${Math.random().toString(16).slice(2)}`;
      }

      function materialFromForm(data, id) {
        return {
          id,
          subject: formValue(data, "subject"),
          name: formValue(data, "name"),
          phase: formValue(data, "phase"),
          unitType: formValue(data, "unitType"),
          startValue: formNumber(data, "startValue"),
          endValue: formNumber(data, "endValue"),
          currentValue: formNumber(data, "currentValue"),
          deadline: formValue(data, "deadline"),
          subjectPriority: formNumber(data, "subjectPriority"),
          materialPriority: formNumber(data, "materialPriority"),
          weekdays: formWeekdays(data),
          context: formValue(data, "context"),
          minChunk: formNumber(data, "minChunk"),
          initialMinutesPerUnit: formNumber(data, "minutesPerUnit"),
          estimatedMinutesPerUnit: formNumber(data, "minutesPerUnit"),
          active: true
        };
      }

      function scheduleFromForm(data, id) {
        return {
          id,
          weekday: formNumber(data, "weekday"),
          startTime: formValue(data, "startTime"),
          endTime: formValue(data, "endTime"),
          context: formValue(data, "context"),
          focusLevel: formValue(data, "focusLevel"),
          extendable: data.get("extendable") === "on",
          label: formValue(data, "label"),
          active: true
        };
      }

      function studyLogFromForm(data, id) {
        return {
          id,
          date: formValue(data, "date") || currentDateISO(),
          minutes: Math.max(1, Math.round(formNumber(data, "minutes"))),
          label: formValue(data, "label"),
          createdAt: new Date().toISOString()
        };
      }

      function fillMaterialForm(material) {
        const form = document.getElementById("material-form");
        setField(form, "subject", material.subject);
        setField(form, "name", material.name);
        setField(form, "phase", material.phase);
        setField(form, "unitType", material.unitType);
        setField(form, "currentValue", material.currentValue);
        setField(form, "endValue", material.endValue);
        setField(form, "startValue", material.startValue);
        setField(form, "deadline", material.deadline);
        setField(form, "subjectPriority", material.subjectPriority);
        setField(form, "materialPriority", material.materialPriority);
        setWeekdayFields(form, normalizeMaterialWeekdays(material));
        setField(form, "context", material.context);
        setField(form, "minChunk", material.minChunk);
        setField(form, "minutesPerUnit", minutesPerUnit(material));
        editingMaterialId = material.id;
        document.getElementById("material-form-title").textContent = "教材を編集中";
        document.getElementById("material-editing-note").textContent = `${material.name} を編集しています。`;
        document.getElementById("material-editing-note").hidden = false;
        document.getElementById("material-submit-button").textContent = "更新して再計算";
        document.getElementById("cancel-material-edit").hidden = false;
        document.querySelector('[data-panel="materials"]').click();
        form.querySelector('[name="subject"]').focus();
      }

      function fillScheduleForm(block) {
        const form = document.getElementById("schedule-form");
        setField(form, "label", block.label);
        setField(form, "weekday", block.weekday);
        setField(form, "startTime", block.startTime);
        setField(form, "endTime", block.endTime);
        setField(form, "context", block.context);
        setField(form, "focusLevel", block.focusLevel);
        form.elements.extendable.checked = Boolean(block.extendable);
        editingScheduleId = block.id;
        document.getElementById("schedule-form-title").textContent = "学習枠を編集中";
        document.getElementById("schedule-editing-note").textContent = `${block.label} を編集しています。`;
        document.getElementById("schedule-editing-note").hidden = false;
        document.getElementById("schedule-submit-button").textContent = "学習枠を更新";
        document.getElementById("cancel-schedule-edit").hidden = false;
        document.querySelector('[data-panel="schedule"]').click();
        form.querySelector('[name="label"]').focus();
      }

      function setField(form, name, value) {
        form.elements[name].value = value ?? "";
      }

      function formWeekdays(data) {
        const values = data.getAll("weekdays").map(Number).filter((day) => day >= 0 && day <= 6);
        return values.length > 0 ? values : [0, 1, 2, 3, 4, 5, 6];
      }

      function setWeekdayFields(form, days) {
        const selected = new Set(days);
        form.querySelectorAll('input[name="weekdays"]').forEach((input) => {
          input.checked = selected.has(Number(input.value));
        });
      }

      function resetMaterialEditing() {
        editingMaterialId = "";
        document.getElementById("material-form").reset();
        setWeekdayFields(document.getElementById("material-form"), [0, 1, 2, 3, 4, 5, 6]);
        document.getElementById("material-form-title").textContent = "教材を追加";
        document.getElementById("material-editing-note").textContent = "";
        document.getElementById("material-editing-note").hidden = true;
        document.getElementById("material-submit-button").textContent = "追加して再計算";
        document.getElementById("cancel-material-edit").hidden = true;
      }

      function resetScheduleEditing() {
        editingScheduleId = "";
        document.getElementById("schedule-form").reset();
        document.getElementById("schedule-form-title").textContent = "学習枠を追加";
        document.getElementById("schedule-editing-note").textContent = "";
        document.getElementById("schedule-editing-note").hidden = true;
        document.getElementById("schedule-submit-button").textContent = "学習枠を保存";
        document.getElementById("cancel-schedule-edit").hidden = true;
      }

      function removeTasksForSchedule(blockId) {
        planner.existingTasks = planner.existingTasks.filter((task) => {
          const slotId = String(task.slotId || "");
          return slotId !== blockId && !slotId.endsWith(`:${blockId}`);
        });
      }

      document.querySelectorAll("[data-panel]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-panel]").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          document.body.dataset.activePanel = button.dataset.panel;
          for (const id of ["today-panel", "materials-panel", "schedule-panel"]) {
            document.getElementById(id).hidden = id !== `${button.dataset.panel}-panel`;
          }
        });
      });

      document.getElementById("material-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        const id = editingMaterialId || createId("material");
        const nextMaterial = materialFromForm(data, id);
        const existingIndex = planner.materials.findIndex((material) => material.id === id);
        if (existingIndex >= 0) {
          planner.materials[existingIndex] = nextMaterial;
        } else {
          planner.materials.push(nextMaterial);
        }
        resetMaterialEditing();
        savePlanner();
        render();
        document.querySelector('[data-panel="materials"]').click();
      });

      document.getElementById("schedule-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        const id = editingScheduleId || createId("slot");
        const nextBlock = scheduleFromForm(data, id);
        const existingIndex = planner.scheduleTemplates.findIndex((block) => block.id === id);
        if (existingIndex >= 0) {
          planner.scheduleTemplates[existingIndex] = nextBlock;
        } else {
          planner.scheduleTemplates.push(nextBlock);
        }
        resetScheduleEditing();
        savePlanner();
        render();
        document.querySelector('[data-panel="schedule"]').click();
      });

      document.getElementById("study-log-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const data = new FormData(form);
        planner.studyLogs = planner.studyLogs || [];
        planner.studyLogs.push(studyLogFromForm(data, createId("study-log")));
        form.reset();
        form.elements.date.value = currentDateISO();
        form.elements.minutes.value = 60;
        savePlanner();
        render();
        document.querySelector('[data-panel="schedule"]').click();
      });

      document.getElementById("study-task-select").addEventListener("change", syncStudyTaskFields);

      document.getElementById("study-task-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        const task = visibleTasksByKey.get(formValue(data, "taskKey"));
        if (!task) {
          alert("完了する課題を選んでください。");
          return;
        }
        completeTask(task, formNumber(data, "completedUntil"), formNumber(data, "actualMinutes"), formValue(data, "date"));
        document.querySelector('[data-panel="schedule"]').click();
      });

      document.getElementById("study-material-select").addEventListener("change", syncStudyMaterialFields);

      document.getElementById("study-material-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        recordMaterialStudy(
          formValue(data, "materialId"),
          formValue(data, "date"),
          formNumber(data, "quantity"),
          formNumber(data, "actualMinutes")
        );
        document.querySelector('[data-panel="schedule"]').click();
      });

      document.getElementById("material-list").addEventListener("click", (event) => {
        const button = event.target.closest("[data-material-action]");
        if (!button) return;
        const id = button.dataset.materialId;
        const material = planner.materials.find((item) => item.id === id);
        if (!material) return;

        if (button.dataset.materialAction === "edit") {
          fillMaterialForm(material);
          return;
        }

        if (confirm(`${material.name} を削除しますか？`)) {
          planner.materials = planner.materials.filter((item) => item.id !== id);
          planner.existingTasks = planner.existingTasks.filter((task) => task.materialId !== id);
          if (editingMaterialId === id) resetMaterialEditing();
          savePlanner();
          render();
        }
      });

      document.getElementById("schedule-list").addEventListener("click", (event) => {
        const button = event.target.closest("[data-schedule-action]");
        if (!button) return;
        const id = button.dataset.scheduleId;
        const block = planner.scheduleTemplates.find((item) => item.id === id);
        if (!block) return;

        if (button.dataset.scheduleAction === "edit") {
          fillScheduleForm(block);
          return;
        }

        if (confirm(`${block.label} を削除しますか？`)) {
          planner.scheduleTemplates = planner.scheduleTemplates.filter((item) => item.id !== id);
          removeTasksForSchedule(id);
          if (editingScheduleId === id) resetScheduleEditing();
          savePlanner();
          render();
        }
      });

      document.getElementById("study-log-list").addEventListener("click", (event) => {
        const button = event.target.closest("[data-study-log-delete]");
        if (!button) return;
        planner.studyLogs = (planner.studyLogs || []).filter((log) => log.id !== button.dataset.studyLogDelete);
        savePlanner();
        render();
      });

      document.getElementById("today-panel").addEventListener("change", (event) => {
        const checkbox = event.target.closest("[data-complete-task]");
        if (!checkbox) return;
        if (!checkbox.checked) return;
        const task = visibleTasksByKey.get(checkbox.dataset.completeTask);
        if (!task) return;
        const card = checkbox.closest(".task-card");
        completeTask(task, task.rangeEnd, actualMinutesFromCard(card, task));
      });

      document.getElementById("today-panel").addEventListener("click", (event) => {
        const button = event.target.closest("[data-partial-task]");
        if (!button) return;
        const task = visibleTasksByKey.get(button.dataset.partialTask);
        const card = button.closest(".task-card");
        const input = card?.querySelector("[data-partial-value]");
        if (!task || !input) return;
        completeTask(task, input.value, actualMinutesFromCard(card, task));
      });

      document.getElementById("cancel-material-edit").addEventListener("click", resetMaterialEditing);
      document.getElementById("cancel-schedule-edit").addEventListener("click", resetScheduleEditing);

      document.getElementById("soft-end").addEventListener("change", (event) => {
        if (event.target.value) {
          planner.settings.softEndTime = event.target.value;
          savePlanner();
          render();
        }
      });

      document.getElementById("hard-stop").addEventListener("change", (event) => {
        if (event.target.value) {
          planner.settings.hardStopTime = event.target.value;
          savePlanner();
          render();
        }
      });

      document.getElementById("reset-button").addEventListener("click", () => {
        planner = structuredClone(seedInput);
        localStorage.removeItem(storageKey);
        render();
      });

      document.getElementById("theme-options").addEventListener("click", (event) => {
        const button = event.target.closest("[data-theme-choice]");
        if (button) applyTheme(button.dataset.themeChoice);
      });

      function normalizeCloudCode(code) {
        return String(code ?? "").normalize("NFKC").toUpperCase().replace(/[^A-Z0-9]/g, "");
      }

      function formatCloudCode(code) {
        const normalized = normalizeCloudCode(code);
        if (normalized.startsWith("JKB") && normalized.length === 11) {
          return `${normalized.slice(0, 3)}-${normalized.slice(3, 7)}-${normalized.slice(7, 11)}`;
        }
        return normalized;
      }

      function generateCloudCode() {
        const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        const values = crypto.getRandomValues(new Uint32Array(8));
        let body = "";
        for (const value of values) body += alphabet[value % alphabet.length];
        return `JKB${body}`;
      }

      function createCloudCodeImmediately() {
        const code = generateCloudCode();
        const formatted = formatCloudCode(code);
        const input = document.getElementById("personal-code-input");
        input.value = formatted;
        input.focus();
        input.select();
        setCurrentCloudCode(code);
        setTransferStatus(`個人コード ${formatted} を作成しました。オンライン保存を試しています。`);
        window.dispatchEvent(new CustomEvent("jukenbanso:cloud-code-created", { detail: { code } }));
      }

      document.getElementById("create-cloud-code").addEventListener("click", createCloudCodeImmediately);
      document.getElementById("copy-cloud-code").addEventListener("click", copyCurrentCloudCode);

      window.jukenbansoApp = {
        getPlanner: () => structuredClone(planner),
        setPlanner(nextPlanner) {
          planner = structuredClone(nextPlanner);
          localStorage.setItem(storageKey, JSON.stringify(planner));
          render();
        },
        getTheme: loadTheme,
        setTheme: applyTheme,
        setStatus: setTransferStatus,
        setCloudCode: setCurrentCloudCode
      };

      render();
    </script>
    <script type="module" src="./firebase-sync.js"></script>
  </body>
</html>
