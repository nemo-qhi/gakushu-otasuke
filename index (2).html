<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>受験伴走システム</title>
    <style>
      :root {
        --background: #f7f8f5;
        --foreground: #17201d;
        --muted: #68736d;
        --line: #dce2dc;
        --panel: #ffffff;
        --blue: #2f68bd;
        --green: #2d7f5e;
        --amber: #a66418;
        --slate: #5b6670;
        --soft: #edf1ed;
        --input: #fbfcfa;
        --chip: #e9efe9;
        --focus: rgba(47, 104, 189, 0.22);
      }

      :root[data-theme="mint"] {
        --background: #f0f7ef;
        --foreground: #15251b;
        --muted: #627369;
        --line: #d4e2d4;
        --panel: #fefffc;
        --soft: #e7f0e6;
        --input: #fbfdf8;
        --chip: #dfeade;
      }

      :root[data-theme="sky"] {
        --background: #f1f6fa;
        --foreground: #14212c;
        --muted: #60707e;
        --line: #d5e1ea;
        --panel: #ffffff;
        --soft: #e6eef5;
        --input: #fbfdff;
        --chip: #dfeaf3;
      }

      :root[data-theme="lavender"] {
        --background: #f6f3f9;
        --foreground: #231b2b;
        --muted: #70677a;
        --line: #e2d9ea;
        --panel: #fffefe;
        --soft: #eee8f3;
        --input: #fffaff;
        --chip: #e7e0ee;
      }

      :root[data-theme="warm"] {
        --background: #f8f5ed;
        --foreground: #251f16;
        --muted: #756d5d;
        --line: #e4ddcc;
        --panel: #fffefa;
        --soft: #f0eadc;
        --input: #fffdf7;
        --chip: #ebe4d5;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body[data-active-panel="today"] #materials-panel,
      body[data-active-panel="today"] #schedule-panel,
      body[data-active-panel="materials"] #today-panel,
      body[data-active-panel="materials"] #schedule-panel,
      body[data-active-panel="schedule"] #today-panel,
      body[data-active-panel="schedule"] #materials-panel {
        display: none !important;
      }

      html {
        background: var(--background);
      }

      body {
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: "UDデジタル教科書体 NP-R", "UD デジタル 教科書体 NP-R", "UD Digi Kyokasho NP-R", "Yu Gothic", "Hiragino Sans", "Segoe UI", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
        font-size: 16px;
      }

      button {
        cursor: pointer;
      }

      h1,
      h2,
      h3,
      p {
        overflow-wrap: anywhere;
      }

      h1 {
        margin: 0;
        font-size: 48px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      h2 {
        margin: 0;
        font-size: 20px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      h3 {
        margin: 4px 0;
        font-size: 17px;
        line-height: 1.3;
        letter-spacing: 0;
      }

      .shell {
        width: min(100%, 1040px);
        margin: 0 auto;
        padding: calc(18px + env(safe-area-inset-top)) 16px
          calc(28px + env(safe-area-inset-bottom));
      }

      .topbar,
      .today-band {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .topbar {
        min-height: 86px;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .sync-pill {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin: 4px 0 18px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      .segmented button {
        min-height: 44px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font-weight: 800;
      }

      .segmented button.active {
        background: var(--panel);
        color: var(--foreground);
        box-shadow: 0 1px 4px rgba(24, 32, 28, 0.08);
      }

      .theme-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.95fr);
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .theme-options {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .theme-options button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--input);
        color: var(--foreground);
        font-size: 13px;
        font-weight: 900;
      }

      .theme-options button.active {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px var(--focus);
      }

      .theme-swatch {
        width: 16px;
        height: 16px;
        border: 1px solid rgba(23, 32, 29, 0.18);
        border-radius: 999px;
      }

      .theme-swatch-paper {
        background: #f7f8f5;
      }

      .theme-swatch-mint {
        background: #dfeade;
      }

      .theme-swatch-sky {
        background: #dfeaf3;
      }

      .theme-swatch-lavender {
        background: #e7e0ee;
      }

      .theme-swatch-warm {
        background: #ebe4d5;
      }

      .transfer-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.95fr);
        gap: 12px;
        align-items: start;
        margin-bottom: 18px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .transfer-panel p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .transfer-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 112px;
        gap: 8px;
        align-items: end;
      }

      .transfer-actions label {
        grid-column: 1 / -1;
      }

      .current-code-card {
        display: grid;
        gap: 8px;
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--soft);
      }

      .current-code-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
      }

      .current-code-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 92px;
        gap: 8px;
        align-items: center;
      }

      .current-code-value {
        min-height: 36px;
        padding: 8px 10px;
        border-radius: 7px;
        background: var(--panel);
        color: var(--foreground);
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 15px;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .code-copy-button {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--foreground);
        font-size: 13px;
        font-weight: 900;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 10px 0 18px;
      }

      .metric {
        min-height: 104px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .metric span,
      .metric strong {
        display: block;
      }

      .metric span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .metric strong {
        margin-top: 14px;
        font-size: 28px;
        line-height: 1;
        letter-spacing: 0;
      }

      .metric-blue {
        border-top: 4px solid var(--blue);
      }

      .metric-green {
        border-top: 4px solid var(--green);
      }

      .metric-amber {
        border-top: 4px solid var(--amber);
      }

      .metric-slate {
        border-top: 4px solid var(--slate);
      }

      .today-band {
        min-height: 74px;
        margin-top: 8px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .today-band span {
        color: var(--muted);
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 12px;
      }

      .task-list {
        display: grid;
        gap: 10px;
        margin: 18px 0;
      }

      .pace-list {
        display: grid;
        gap: 10px;
        margin: 18px 0;
      }

      .pace-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(180px, 0.38fr);
        gap: 12px;
        align-items: center;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .pace-card strong,
      .pace-card span,
      .pace-card small {
        overflow-wrap: anywhere;
      }

      .pace-card strong {
        display: block;
        margin: 6px 0;
        font-size: 16px;
      }

      .pace-card small {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }

      .pace-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .pace-grid span {
        min-height: 42px;
        padding: 8px;
        border-radius: 7px;
        background: var(--soft);
        color: var(--foreground);
        font-size: 12px;
        font-weight: 800;
      }

      .pace-ok {
        border-left: 4px solid var(--green);
      }

      .pace-warning {
        border-left: 4px solid var(--amber);
      }

      .pace-danger {
        border-left: 4px solid #b94a48;
      }

      .empty-state {
        min-height: 96px;
        padding: 18px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .task-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(190px, 0.42fr);
        gap: 14px;
        align-items: center;
        min-height: 112px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .subject {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 9px;
        border-radius: 999px;
        background: var(--chip);
        color: #26342e;
        font-size: 12px;
        font-weight: 800;
      }

      .task-main p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .task-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0;
      }

      .task-meta span {
        min-height: 28px;
        padding: 5px 8px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .task-complete {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--soft);
        color: var(--foreground);
        font-size: 13px;
        font-weight: 900;
      }

      .task-complete input {
        width: 20px;
        min-height: 20px;
      }

      .task-progress {
        display: grid;
        gap: 5px;
        min-height: 58px;
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
      }

      .task-progress input {
        min-height: 32px;
        padding: 5px 7px;
        font-size: 13px;
      }

      .progress-action {
        min-height: 58px;
        border: 1px solid rgba(47, 104, 189, 0.38);
        border-radius: 7px;
        background: #eef4fb;
        color: #1f4f94;
        font-size: 13px;
        font-weight: 900;
      }

      .thresholds {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .thresholds span {
        min-height: 44px;
        padding: 11px 8px;
        border-radius: 7px;
        background: var(--soft);
        color: #25312c;
        font-size: 13px;
        font-weight: 800;
        text-align: center;
      }

      .two-column,
      .form-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 0.78fr);
        gap: 12px;
        align-items: start;
      }

      .panel,
      .entry-form {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .panel {
        min-height: 220px;
      }

      .management-column {
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .entry-form {
        display: grid;
        gap: 14px;
      }

      .inline-log-form {
        display: grid;
        gap: 10px;
        margin-top: 14px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--input);
        color: var(--foreground);
        padding: 10px 11px;
      }

      textarea {
        min-height: 118px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .check-row {
        display: flex;
        align-items: center;
        min-height: 46px;
        gap: 10px;
        padding-top: 22px;
      }

      .check-row input {
        width: 22px;
        min-height: 22px;
      }

      .weekday-picker {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--input);
      }

      .weekday-picker label {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        gap: 5px;
        padding: 6px;
        border-radius: 7px;
        background: var(--panel);
        color: var(--foreground);
        font-size: 13px;
        font-weight: 900;
      }

      .weekday-picker input {
        width: 16px;
        min-height: 16px;
      }

      .form-buttons {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(120px, 0.45fr);
        gap: 8px;
      }

      .primary-action,
      .secondary-action {
        min-height: 48px;
        border-radius: 7px;
        font-weight: 900;
      }

      .primary-action {
        border: 0;
        background: var(--blue);
        color: #ffffff;
      }

      .secondary-action {
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--foreground);
      }

      .bars {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 70px minmax(0, 1fr) 54px;
        gap: 10px;
        align-items: center;
        min-height: 28px;
        font-size: 13px;
      }

      .bar-row div {
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--chip);
      }

      .bar-row i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2f68bd, #2d7f5e);
      }

      .bar-row b {
        color: var(--muted);
        font-weight: 700;
        text-align: right;
      }

      .quiet,
      .warning-list {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .warning-list {
        padding-left: 18px;
      }

      .compact-list {
        display: grid;
        gap: 9px;
        margin-top: 16px;
      }

      .weekday-group {
        display: grid;
        gap: 6px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }

      .weekday-group-title {
        color: var(--foreground);
        font-size: 14px;
        font-weight: 900;
      }

      .compact-list div {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr) 96px;
        gap: 10px;
        align-items: center;
        min-height: 48px;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
      }

      .compact-list b {
        font-size: 13px;
      }

      .compact-list span,
      .compact-list small {
        overflow-wrap: anywhere;
      }

      .compact-list span {
        font-size: 14px;
      }

      .compact-list small {
        color: var(--muted);
        font-size: 12px;
        text-align: right;
      }

      .compact-list small button {
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--soft);
        color: var(--foreground);
        font-size: 12px;
        font-weight: 900;
      }

      .item-actions {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(2, minmax(92px, 1fr));
        gap: 6px;
      }

      .item-actions button {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--soft);
        color: var(--foreground);
        font-size: 13px;
        font-weight: 900;
      }

      .item-actions button:first-child {
        border-color: rgba(47, 104, 189, 0.38);
        background: #eef4fb;
        color: #1f4f94;
      }

      .material-workspace {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .material-card {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      .material-card header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }

      .material-card strong {
        overflow-wrap: anywhere;
      }

      .mini-section {
        display: grid;
        gap: 6px;
      }

      .mini-section h3 {
        margin: 0;
        color: var(--foreground);
        font-size: 13px;
      }

      .mini-list {
        display: grid;
        gap: 6px;
      }

      .mini-row {
        display: grid;
        grid-template-columns: 82px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        min-height: 40px;
        padding: 8px;
        border: 1px solid rgba(135, 122, 98, 0.2);
        border-radius: 7px;
        background: var(--panel);
        font-size: 12px;
      }

      .mini-row b,
      .mini-row span {
        overflow-wrap: anywhere;
      }

      .mini-row b {
        color: var(--foreground);
      }

      .mini-row span {
        color: var(--muted);
      }

      .log-summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }

      .log-summary span {
        min-height: 48px;
        padding: 10px;
        border-radius: 7px;
        background: var(--soft);
        color: var(--foreground);
        font-size: 13px;
        font-weight: 900;
      }

      .editing-note {
        margin: 8px 0 0;
        color: var(--blue);
        font-size: 13px;
        font-weight: 900;
      }

      @media (max-width: 720px) {
        .shell {
          padding-right: 12px;
          padding-left: 12px;
        }

        .summary-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .metric {
          min-height: 94px;
        }

        .task-card,
        .pace-card,
        .two-column,
        .form-layout,
        .theme-panel,
        .transfer-panel {
          grid-template-columns: 1fr;
        }

        .theme-options {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .thresholds {
          grid-template-columns: repeat(3, minmax(74px, 1fr));
        }

        .log-summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .today-band {
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          padding: 14px 0;
        }
      }

      @media (max-width: 430px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
          min-height: 120px;
          justify-content: center;
        }

        .segmented,
        .theme-options,
        .weekday-picker,
        .transfer-actions,
        .form-buttons,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .transfer-actions label {
